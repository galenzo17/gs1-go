# GoReleaser configuration: https://goreleaser.com
#
# A pushed tag vX.Y.Z runs `goreleaser release --clean` from release.yml and
# publishes the CLI binaries, archives, checksums and SBOMs to the GitHub
# release, the Homebrew cask, the AUR package, the ghcr.io image and the
# deb/rpm/apk packages. The WebAssembly artifacts are built by the before
# hook and attached to the release; npm publication follows in release.yml.
#
# Test locally without a tag: make snapshot
version: 2

project_name: gs1

before:
  hooks:
    - go mod tidy
    - go test -race -count=1 ./...
    - bash wasm/build.sh

builds:
  - id: gs1
    main: ./cmd/gs1
    binary: gs1
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }} -X main.commit={{ .ShortCommit }} -X main.date={{ .CommitDate }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # Bare binaries keep the names of the previous hand-rolled workflow
  # (gs1_v0.1.0_linux_amd64) for anything already scripted against them.
  - id: binaries
    ids: [gs1]
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
  # Archives with licence and README feed Homebrew and human downloads.
  - id: archives
    ids: [gs1]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive
    ids: [archives]

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Build and CI
      regexp: '^.*?(build|ci)(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999
  filters:
    exclude:
      - "^test"
      - "^refactor"
      - "^chore"
      - "merge conflict"
      - "Merge pull request"

release:
  github:
    owner: galenzo17
    name: gs1-go
  draft: false
  prerelease: auto
  mode: replace
  extra_files:
    - glob: ./wasm/gs1.wasm
    - glob: ./wasm/wasm_exec.js
    - glob: ./wasm/gs1-loader.js
    - glob: ./wasm/gs1.d.ts
  footer: |
    ## Install

    ```bash
    brew install galenzo17/tap/gs1
    yay -S gs1-bin
    docker run --rm ghcr.io/galenzo17/gs1:{{ .Version }} parse "(01)04150000021126(10)LOT42"
    go install github.com/galenzo17/gs1-go/cmd/gs1@{{ .Tag }}
    npm install @galenzo17/gs1-wasm@{{ .Version }}
    ```

homebrew_casks:
  - name: gs1
    ids: [archives]
    binaries:
      - gs1
    directory: Casks
    homepage: https://github.com/galenzo17/gs1-go
    description: "GS1 Application Identifier parser and validator"
    repository:
      owner: galenzo17
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: galenzo17
      email: galenzo17@users.noreply.github.com
    commit_msg_template: "gs1 {{ .Tag }}"
    skip_upload: auto

aurs:
  - name: gs1-bin
    ids: [archives]
    homepage: https://github.com/galenzo17/gs1-go
    description: "GS1 Application Identifier parser and validator for GS1-128, GS1 DataMatrix, GS1 QR, EAN/UPC and EPC/RFID"
    maintainers:
      - "Agustín Bereciartúa Castillo <galenzo17 at users dot noreply dot github dot com>"
    license: MIT
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/gs1-bin.git
    provides:
      - gs1
    conflicts:
      - gs1
    package: |-
      install -Dm755 "./gs1" "${pkgdir}/usr/bin/gs1"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/gs1-bin/LICENSE"
    commit_author:
      name: galenzo17
      email: galenzo17@users.noreply.github.com
    commit_msg_template: "Update to {{ .Tag }}"
    skip_upload: auto

nfpms:
  - id: packages
    ids: [gs1]
    package_name: gs1
    vendor: galenzo17
    homepage: https://github.com/galenzo17/gs1-go
    maintainer: "Agustín Bereciartúa Castillo <galenzo17@users.noreply.github.com>"
    description: "GS1 Application Identifier parser and validator"
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    section: utils
    contents:
      - src: LICENSE
        dst: /usr/share/doc/gs1/LICENSE
        file_info:
          mode: 0644

dockers_v2:
  - id: gs1
    ids: [gs1]
    images:
      - ghcr.io/galenzo17/gs1
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - latest
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: gs1
      org.opencontainers.image.description: "GS1 Application Identifier parser and validator"
      org.opencontainers.image.source: https://github.com/galenzo17/gs1-go
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT
    extra_files:
      - LICENSE
