name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.24", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage
        if: matrix.go == 'stable'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  hygiene:
    name: Module hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - name: Zero dependencies
        run: |
          ! grep -q '^require' go.mod
          test ! -e go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go mod verify

  generate:
    name: Generated AI table is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go generate ./...
      - run: git diff --exit-code -- ai_table.go

  conformance:
    name: GS1 conformance vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -count=1 -run '^TestConformance$|^TestLogisticLabelFixtures$' -v . | grep -E 'conformance|^(--- |ok|FAIL)'
        # bash sets -o pipefail, so the step fails on go test, not grep
        shell: bash

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o gs1.wasm ./cmd/gs1-wasm
      - run: ls -la gs1.wasm

  smoke-fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -run='^$' -fuzz=FuzzParse -fuzztime=30s .
