name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.24", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage
        if: matrix.go == 'stable'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  generate:
    name: Generated AI table is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go generate ./...
      - run: git diff --exit-code -- ai_table.go

  conformance:
    name: GS1 conformance vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -count=1 -run '^TestConformance$|^TestLogisticLabelFixtures$' -v . | grep -E 'conformance|^(--- |ok|FAIL)'
        # bash sets -o pipefail, so the step fails on go test, not grep
        shell: bash

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o gs1.wasm ./cmd/gs1-wasm
      - run: ls -la gs1.wasm

  npm-package:
    name: npm package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: make wasm
      - run: cp LICENSE wasm/
      - name: Loader resolves the binary next to itself
        run: node wasm/package.test.mjs
      - name: Package contains exactly the published files
        run: |
          cd wasm
          npm pack --dry-run --json | node -e '
            const [pkg] = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const files = pkg.files.map((f) => f.path).sort();
            const want = ["LICENSE", "README.md", "gs1-loader.js", "gs1.d.ts", "gs1.wasm", "package.json", "wasm_exec.js"];
            if (JSON.stringify(files) !== JSON.stringify(want)) {
              console.error("npm pack would ship", files, "want", want);
              process.exit(1);
            }
            console.log("npm pack ships", files.join(", "));
          '


  smoke-fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -run='^$' -fuzz=FuzzParse -fuzztime=30s .
